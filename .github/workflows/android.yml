name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Provision PDFium for tests
        run: |
          mkdir -p /tmp/pdfium
          curl -sL -o /tmp/pdfium.tgz "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz"
          tar xzf /tmp/pdfium.tgz -C /tmp/pdfium
          test -f /tmp/pdfium/lib/libpdfium.so && echo "PDFium ready"

      - name: Test
        env:
          PDFIUM_SO: /tmp/pdfium/lib/libpdfium.so
        run: flutter test

      - name: Decode keystore (if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "Keystore decoded; release signing will be used."
          else
            echo "No KEYSTORE_BASE64 secret; falling back to debug signing."
          fi

      - name: Build release APKs (per ABI)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=/tmp/lr-debug-info

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: litereader-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
