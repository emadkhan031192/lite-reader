name: litereader
description: Lite Reader — a small, fast, fully offline PDF reader and viewer for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # PDF rendering (PDFium, permissive license). No commercial-licensed PDF packages.
  pdfrx: ^2.6.5
  # PDF composition for tool outputs (pure Dart, MIT)
  pdf: ^3.13.1
  # Image drawing for annotation export (MIT)
  image: ^4.12.0

  # Storage
  sqflite: ^2.4.4+1
  shared_preferences: ^2.5.6

  # Files / sharing / scanning
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  cunning_document_scanner: ^3.0.3
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icon/

  fonts:
    - family: ZenKaku
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Regular.ttf
          weight: 400
        - asset: assets/fonts/ZenKakuGothicNew-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenKakuGothicNew-Bold.ttf
          weight: 700
    - family: DMMono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
